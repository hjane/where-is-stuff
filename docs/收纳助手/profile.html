<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>收纳助手 - 个人中心</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
        @layer utilities {
            .glass {
                background: rgba(255, 255, 255, 0.7);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.3);
            }
            .bg-home {
                background-image: linear-gradient(rgba(0,0,0,0.05), rgba(0,0,0,0.05)), url('/agent-py/static/source/images/placeholder.svg');
                background-size: cover;
                background-position: center;
            }
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<!-- iPhone 15 Pro Container -->
<div class="w-[375px] h-[812px] bg-home relative overflow-hidden rounded-[55px] shadow-2xl border-[8px] border-gray-900">
<!-- Status Bar -->
<div class="absolute top-0 w-full h-12 flex items-center justify-between px-8 z-20 text-gray-800">
<span class="text-sm font-semibold">9:41</span>
<div class="flex items-center gap-1.5">
<iconify-icon class="text-lg" icon="fluent:cellular-data-24-filled"></iconify-icon>
<iconify-icon class="text-lg" icon="fluent:wifi-1-24-filled"></iconify-icon>
<iconify-icon class="text-lg" icon="fluent:battery-1-24-filled"></iconify-icon>
</div>
</div>
<!-- Header -->
<div class="absolute top-12 w-full px-8 flex items-center justify-between z-20 py-4">
<button class="text-gray-800" onclick="window.history.back()">
<iconify-icon class="text-2xl" icon="fluent:chevron-left-24-regular"></iconify-icon>
</button>
<h1 class="text-lg font-bold text-gray-800">个人中心</h1>
<button class="text-gray-800">
<iconify-icon class="text-2xl" icon="fluent:more-horizontal-24-regular"></iconify-icon>
</button>
</div>
<!-- Scrollable Area -->
<div class="h-full pt-32 pb-24 overflow-y-auto px-6">
<!-- Profile Section -->
<div class="flex flex-col items-center mb-8">
<div class="w-24 h-24 rounded-full border-4 border-orange-500 p-1 mb-4 shadow-xl">
<img alt="Avatar" class="w-full h-full rounded-full object-cover" src="https://modao.cc/agent-py/media/generated_images/2026-05-10/918b2af82df24c3eafe82e52e728e253.jpg#desc=Avatar"/>
</div>
<h2 class="text-xl font-bold text-gray-800">收纳达人</h2>
<div class="mt-2 flex items-center gap-2">
<span class="bg-orange-100 text-orange-600 text-[10px] px-2 py-0.5 rounded-full font-bold border border-orange-200 uppercase">免费会员</span>
<span class="text-xs text-gray-400">|</span>
<button class="text-xs text-orange-500 font-semibold hover:underline">升级会员 &gt;</button>
</div>
</div>
<!-- Points Card -->
<div class="bg-gradient-to-r from-orange-500 to-orange-400 rounded-[32px] p-6 text-white shadow-lg relative overflow-hidden mb-8">
<div class="absolute -right-4 -top-4 w-24 h-24 bg-white/10 rounded-full blur-2xl"></div>
<div class="flex justify-between items-start mb-4">
<div>
<p class="text-orange-50 text-xs font-medium opacity-80">我的积分</p>
<p class="text-3xl font-black mt-1">¥ 185</p>
</div>
<iconify-icon class="text-3xl text-white/50" icon="fluent:person-star-24-filled"></iconify-icon>
</div>
<div class="flex gap-3">
<button class="flex-1 bg-white/20 backdrop-blur-md py-2.5 rounded-2xl text-xs font-bold border border-white/30 active:scale-95 transition-transform">充值积分</button>
<button class="flex-1 bg-white/20 backdrop-blur-md py-2.5 rounded-2xl text-xs font-bold border border-white/30 active:scale-95 transition-transform">明细 &gt;</button>
</div>
</div>
<!-- Menu List -->
<div class="glass rounded-[32px] overflow-hidden border border-white/50 divide-y divide-white/20">
<button class="w-full flex items-center justify-between p-5 hover:bg-white/40 transition-colors">
<div class="flex items-center gap-4">
<div class="w-10 h-10 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center">
<iconify-icon class="text-xl" icon="fluent:chat-warning-24-regular"></iconify-icon>
</div>
<span class="text-sm font-semibold text-gray-700">意见反馈</span>
</div>
<iconify-icon class="text-gray-400" icon="fluent:chevron-right-24-regular"></iconify-icon>
</button>
<button class="w-full flex items-center justify-between p-5 hover:bg-white/40 transition-colors">
<div class="flex items-center gap-4">
<div class="w-10 h-10 bg-orange-50 text-orange-500 rounded-xl flex items-center justify-center">
<iconify-icon class="text-xl" icon="fluent:premium-24-regular"></iconify-icon>
</div>
<span class="text-sm font-semibold text-gray-700">会员中心</span>
</div>
<iconify-icon class="text-gray-400" icon="fluent:chevron-right-24-regular"></iconify-icon>
</button>
<button class="w-full flex items-center justify-between p-5 hover:bg-white/40 transition-colors">
<div class="flex items-center gap-4">
<div class="w-10 h-10 bg-gray-50 text-gray-500 rounded-xl flex items-center justify-center">
<iconify-icon class="text-xl" icon="fluent:settings-24-regular"></iconify-icon>
</div>
<span class="text-sm font-semibold text-gray-700">设置</span>
</div>
<iconify-icon class="text-gray-400" icon="fluent:chevron-right-24-regular"></iconify-icon>
</button>
<button class="w-full flex items-center justify-between p-5 hover:bg-white/40 transition-colors">
<div class="flex items-center gap-4">
<div class="w-10 h-10 bg-green-50 text-green-500 rounded-xl flex items-center justify-center">
<iconify-icon class="text-xl" icon="fluent:share-24-regular"></iconify-icon>
</div>
<span class="text-sm font-semibold text-gray-700">分享应用</span>
</div>
<iconify-icon class="text-gray-400" icon="fluent:chevron-right-24-regular"></iconify-icon>
</button>
<button class="w-full flex items-center justify-between p-5 hover:bg-white/40 transition-colors">
<div class="flex items-center gap-4">
<div class="w-10 h-10 bg-purple-50 text-purple-500 rounded-xl flex items-center justify-center">
<iconify-icon class="text-xl" icon="fluent:info-24-regular"></iconify-icon>
</div>
<span class="text-sm font-semibold text-gray-700">关于我们</span>
</div>
<iconify-icon class="text-gray-400" icon="fluent:chevron-right-24-regular"></iconify-icon>
</button>
</div>
</div>
<!-- Bottom Navigation -->
<div class="absolute bottom-0 w-full glass h-20 px-8 flex items-center justify-between z-20 pb-4">
<a class="flex flex-col items-center gap-1 text-gray-400 hover:text-orange-400" href="index.html">
<iconify-icon class="text-2xl" icon="fluent:home-24-regular"></iconify-icon>
<span class="text-[10px] font-medium">首页</span>
</a>
<a class="flex flex-col items-center gap-1 text-gray-400 hover:text-orange-400" href="rooms.html">
<iconify-icon class="text-2xl" icon="fluent:box-24-regular"></iconify-icon>
<span class="text-[10px] font-medium">房间</span>
</a>
<a class="flex flex-col items-center gap-1 text-orange-600" href="profile.html">
<iconify-icon class="text-2xl" icon="fluent:person-24-filled"></iconify-icon>
<span class="text-[10px] font-bold">我的</span>
</a>
</div>
<!-- Notch Area -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-7 bg-black rounded-b-2xl z-30"></div>
</div>
</body>
</html>
