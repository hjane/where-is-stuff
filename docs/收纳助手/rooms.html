<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>收纳助手 - 房间管理</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
        @layer utilities {
            .glass {
                background: rgba(255, 255, 255, 0.7);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.3);
            }
            .bg-home {
                background-image: linear-gradient(rgba(0,0,0,0.05), rgba(0,0,0,0.05)), url('/agent-py/static/source/images/placeholder.svg');
                background-size: cover;
                background-position: center;
            }
            .no-scrollbar::-webkit-scrollbar { display: none; }
            .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<!-- iPhone 15 Pro Container -->
<div class="w-[375px] h-[812px] bg-home relative overflow-hidden rounded-[55px] shadow-2xl border-[8px] border-gray-900">
<!-- Status Bar -->
<div class="absolute top-0 w-full h-12 flex items-center justify-between px-8 z-20 text-gray-800">
<span class="text-sm font-semibold">9:41</span>
<div class="flex items-center gap-1.5">
<iconify-icon class="text-lg" icon="fluent:cellular-data-24-filled"></iconify-icon>
<iconify-icon class="text-lg" icon="fluent:wifi-1-24-filled"></iconify-icon>
<iconify-icon class="text-lg" icon="fluent:battery-1-24-filled"></iconify-icon>
</div>
</div>
<!-- Header -->
<div class="absolute top-12 w-full px-6 flex items-center justify-between z-20 py-4">
<div class="flex items-center gap-4">
<button class="w-10 h-10 glass rounded-xl flex items-center justify-center text-gray-800" onclick="window.location.href='index.html'">
<iconify-icon class="text-xl" icon="fluent:chevron-left-24-filled"></iconify-icon>
</button>
<div>
<h1 class="text-2xl font-bold text-gray-800">房间</h1>
<p class="text-[10px] text-gray-500 uppercase tracking-widest font-semibold">Storage Association</p>
</div>
</div>
<button class="text-gray-600">
<iconify-icon class="text-2xl" icon="fluent:settings-24-regular"></iconify-icon>
</button>
</div>
<!-- Main Content Area -->
<div class="h-full pt-36 pb-24 overflow-y-auto px-6 no-scrollbar">
<!-- Room Tabs -->
<div class="flex items-center gap-3 overflow-x-auto no-scrollbar mb-4">
<button class="bg-orange-500 text-white px-5 py-2 rounded-xl font-medium shadow-md">主卧</button>
<button class="glass px-5 py-2 rounded-xl text-gray-600 font-medium">客厅</button>
<button class="glass px-3 py-2 rounded-xl text-gray-600">
<iconify-icon icon="fluent:add-24-filled"></iconify-icon>
</button>
</div>
<!-- Indicator & Info -->
<div class="flex items-center justify-between mb-6 px-1">
<div class="flex items-center gap-1.5">
<div class="w-1.5 h-1.5 bg-gray-800 rounded-full"></div>
<div class="w-1.5 h-1.5 bg-gray-400 rounded-full"></div>
<div class="w-1.5 h-1.5 bg-gray-400 rounded-full"></div>
</div>
<p class="text-sm font-semibold text-gray-700">主卧 · <span class="text-orange-500">3</span>个家具 · <span class="text-orange-500">45</span>件物品</p>
</div>
<!-- Furniture List -->
<div class="space-y-4">
<!-- Furniture Card 1 -->
<div class="glass rounded-[32px] p-5 shadow-sm border border-white/50">
<div class="flex justify-between items-start mb-4">
<div class="flex gap-3">
<div class="w-12 h-12 bg-orange-100 rounded-2xl flex items-center justify-center text-2xl">🗄️</div>
<div>
<h3 class="font-bold text-gray-800">床头柜</h3>
<p class="text-xs text-gray-500">3个空间 · 12件物品</p>
</div>
</div>
<button class="text-gray-400"><iconify-icon icon="fluent:more-horizontal-24-filled"></iconify-icon></button>
</div>
<div class="bg-white/40 rounded-2xl p-3">
<p class="text-[11px] text-gray-600 flex items-center gap-1">
<span class="text-orange-500 font-bold">预览:</span> 
                            数据线 充电器 耳机 睡前读物 眼罩...
                        </p>
</div>
</div>
<!-- Furniture Card 2 -->
<div class="glass rounded-[32px] p-5 shadow-sm border border-white/50">
<div class="flex justify-between items-start mb-4">
<div class="flex gap-3">
<div class="w-12 h-12 bg-blue-100 rounded-2xl flex items-center justify-center text-2xl">🚪</div>
<div>
<h3 class="font-bold text-gray-800">衣柜</h3>
<p class="text-xs text-gray-500">3个空间 · 33件物品</p>
</div>
</div>
<button class="text-gray-400"><iconify-icon icon="fluent:more-horizontal-24-filled"></iconify-icon></button>
</div>
<div class="bg-white/40 rounded-2xl p-3">
<p class="text-[11px] text-gray-600 flex items-center gap-1">
<span class="text-orange-500 font-bold">预览:</span> 
                            红色T恤 蓝色牛仔裤 冬季羽绒服...
                        </p>
</div>
</div>
<!-- Furniture Card 3 -->
<div class="glass rounded-[32px] p-5 shadow-sm border border-white/50">
<div class="flex justify-between items-start mb-4">
<div class="flex gap-3">
<div class="w-12 h-12 bg-yellow-100 rounded-2xl flex items-center justify-center text-2xl">📚</div>
<div>
<h3 class="font-bold text-gray-800">书架</h3>
<p class="text-xs text-gray-500">4个空间 · 28件物品</p>
</div>
</div>
<button class="text-gray-400"><iconify-icon icon="fluent:more-horizontal-24-filled"></iconify-icon></button>
</div>
<div class="bg-white/40 rounded-2xl p-3">
<p class="text-[11px] text-gray-600 flex items-center gap-1">
<span class="text-orange-500 font-bold">预览:</span> 
                            工具书 杂志 相框 摆件...
                        </p>
</div>
</div>
</div>
</div>
<!-- Bottom Navigation -->
<div class="absolute bottom-0 w-full glass h-20 px-8 flex items-center justify-between z-20 pb-4">
<a class="flex flex-col items-center gap-1 text-gray-400 hover:text-orange-400" href="index.html">
<iconify-icon class="text-2xl" icon="fluent:home-24-regular"></iconify-icon>
<span class="text-[10px] font-medium">首页</span>
</a>
<a class="flex flex-col items-center gap-1 text-orange-600" href="rooms.html">
<iconify-icon class="text-2xl" icon="fluent:box-24-filled"></iconify-icon>
<span class="text-[10px] font-bold">房间</span>
</a>
<a class="flex flex-col items-center gap-1 text-gray-400 hover:text-orange-400" href="profile.html">
<iconify-icon class="text-2xl" icon="fluent:person-24-regular"></iconify-icon>
<span class="text-[10px] font-medium">我的</span>
</a>
</div>
<!-- Notch Area -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-7 bg-black rounded-b-2xl z-30"></div>
</div>
</body>
</html>
